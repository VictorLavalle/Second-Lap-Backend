spring:
  application:
    name: second-lap-backend
  profiles:
    default: dev
  datasource:
    url: ${SECONDLAP_DB_URL}
    username: ${SECONDLAP_DB_USERNAME}
    password: ${SECONDLAP_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${SECONDLAP_MAX_FILE_SIZE}
      max-request-size: ${SECONDLAP_MAX_REQUEST_SIZE}

server:
  port: ${SERVER_PORT}
  tomcat:
    max-http-form-post-size: ${SECONDLAP_MAX_FORM_POST}
    max-swallow-size: ${SECONDLAP_MAX_SWALLOW}

secondlap:
  cors:
    allowed-origins: ${SECONDLAP_CORS_ALLOWED_ORIGINS}
  storage:
    local:
      base-path: ${SECONDLAP_UPLOADS_DIR}
      public-url-prefix: ${SECONDLAP_UPLOADS_URL_PREFIX}
      max-file-size-bytes: ${SECONDLAP_UPLOADS_MAX_BYTES}
  store:
    whatsapp: ${SECONDLAP_STORE_WHATSAPP}
  admin:
    username: ${SECONDLAP_ADMIN_USERNAME}
    password: ${SECONDLAP_ADMIN_PASSWORD}
  order:
    max-items: ${SECONDLAP_ORDER_MAX_ITEMS}
  ratelimit:
    public-reads:
      capacity: ${SECONDLAP_RL_READS_CAPACITY}
      window-seconds: ${SECONDLAP_RL_READS_WINDOW}
    orders:
      capacity: ${SECONDLAP_RL_ORDERS_CAPACITY}
      window-seconds: ${SECONDLAP_RL_ORDERS_WINDOW}
    orders-per-whatsapp:
      capacity: ${SECONDLAP_RL_ORDERS_WA_CAPACITY}
      window-seconds: ${SECONDLAP_RL_ORDERS_WA_WINDOW}
    admin-login:
      capacity: ${SECONDLAP_RL_ADMIN_CAPACITY}
      window-seconds: ${SECONDLAP_RL_ADMIN_WINDOW}
    admin-api:
      capacity: ${SECONDLAP_RL_ADMIN_API_CAPACITY}
      window-seconds: ${SECONDLAP_RL_ADMIN_API_WINDOW}

management:
  endpoints:
    web:
      exposure:
        include: health,info

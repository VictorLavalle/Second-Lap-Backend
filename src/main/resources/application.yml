spring:
  application:
    name: second-lap-backend
  profiles:
    default: dev
  datasource:
    url: ${SECONDLAP_DB_URL:jdbc:postgresql://localhost:5432/secondlap}
    username: ${SECONDLAP_DB_USERNAME:secondlap}
    password: ${SECONDLAP_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${SECONDLAP_MAX_FILE_SIZE:5MB}
      max-request-size: ${SECONDLAP_MAX_REQUEST_SIZE:15MB}

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    max-http-form-post-size: ${SECONDLAP_MAX_FORM_POST:2MB}
    max-swallow-size: ${SECONDLAP_MAX_SWALLOW:2MB}

secondlap:
  cors:
    allowed-origins: ${SECONDLAP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  storage:
    local:
      base-path: ${SECONDLAP_UPLOADS_DIR:./uploads}
      public-url-prefix: ${SECONDLAP_UPLOADS_URL_PREFIX:/uploads}
      max-file-size-bytes: ${SECONDLAP_UPLOADS_MAX_BYTES:5242880}
  store:
    whatsapp: ${SECONDLAP_STORE_WHATSAPP:529996384026}
  admin:
    username: ${SECONDLAP_ADMIN_USERNAME:admin}
    password: ${SECONDLAP_ADMIN_PASSWORD}
  order:
    max-items: ${SECONDLAP_ORDER_MAX_ITEMS:20}
  ratelimit:
    public-reads:
      capacity: ${SECONDLAP_RL_READS_CAPACITY:120}
      window-seconds: ${SECONDLAP_RL_READS_WINDOW:60}
    orders:
      capacity: ${SECONDLAP_RL_ORDERS_CAPACITY:5}
      window-seconds: ${SECONDLAP_RL_ORDERS_WINDOW:60}
    orders-per-whatsapp:
      capacity: ${SECONDLAP_RL_ORDERS_WA_CAPACITY:3}
      window-seconds: ${SECONDLAP_RL_ORDERS_WA_WINDOW:60}
    admin-login:
      capacity: ${SECONDLAP_RL_ADMIN_CAPACITY:10}
      window-seconds: ${SECONDLAP_RL_ADMIN_WINDOW:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info

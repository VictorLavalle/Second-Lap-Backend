services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: secondlap
      POSTGRES_USER: secondlap
      POSTGRES_PASSWORD: ${SECONDLAP_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - secondlap_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secondlap -d secondlap"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SECONDLAP_DB_URL: jdbc:postgresql://postgres:5432/secondlap
      SECONDLAP_DB_USERNAME: secondlap
      SECONDLAP_UPLOADS_DIR: /app/uploads
    ports:
      - "8080:8080"
    volumes:
      - secondlap_uploads:/app/uploads

volumes:
  secondlap_pgdata:
  secondlap_uploads:
